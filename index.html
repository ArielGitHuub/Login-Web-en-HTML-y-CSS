<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | AdminExpress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="login">
 
    <section class="brand" aria-label="Marca">
      <h2>AdminExpress</h2>
    </section>
 
    <section class="panel">
      <div class="form-box">
        <h1>Let’s <strong>Sign In</strong> 👇</h1>
        <p class="intro">Hey, Enter your details to get sign in to your account.</p>
 
        <form action="#" method="post">
          <div class="field">
            <label for="email">Email</label>
            <div class="input">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <input type="email" id="email" name="email" placeholder="Enter Email" required>
              <span></span>
            </div>
          </div>
 
          <div class="field">
            <label for="password">Password</label>
            <div class="input">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
              <input type="password" id="password" name="password" placeholder="Enter Password" required>
              <button type="button" class="toggle" id="toggle" aria-label="Mostrar u ocultar contraseña">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
              </button>
            </div>
          </div>
 
          <a href="#" class="forgot">Forgot password?</a>
          <button type="submit" class="btn">Sign In</button>
        </form>
 
        <p class="signup">Don’t have an account? <a href="#">Sign Up</a></p>
      </div>
    </section>
 
  </main>
 
  <script>

    const campo = document.getElementById('password');
    document.getElementById('toggle').addEventListener('click', () => {
      campo.type = campo.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
